repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v4.6.0
  hooks:
  - id: check-added-large-files
    args: ['--maxkb=100']
  - id: check-json
  - id: check-yaml
  - id: check-case-conflict
  - id: check-symlinks
  - id: requirements-txt-fixer

- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.4.10
  hooks:
    - id: ruff
      args: [--fix]
    - id: ruff-format